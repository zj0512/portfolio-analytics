<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>投资组合分析工具</title>
<script src="/static/echarts.min.js"></script>
<style>
 body{font-family:'Microsoft YaHei',sans-serif;margin:0;padding:20px;background:#f5f6fa;color:#333}
 h1{font-size:22px;margin:0 0 6px}
 .sub{color:#888;font-size:13px;margin-bottom:16px}
 .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
 .chart{width:100%;height:400px}
 .info{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:4px}
 .info div{font-size:13px;color:#555}
 .info b{font-size:20px;color:#c0392b;display:block}
 /* 时间区间选择 */
 .range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
 .range span{font-size:13px;color:#888}
 .range-btn{padding:4px 12px;border:1px solid #ddd;border-radius:14px;cursor:pointer;font-size:12px;background:#fff}
 .range-btn.active{background:#c0392b;color:#fff;border-color:#c0392b}
 .range input[type=date]{padding:4px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px}
 /* 输入窗口 */
 .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
 .form label{font-size:12px;color:#888;display:block;margin-bottom:3px}
 .form select,.form input,.form button{padding:8px;font-size:14px;border:1px solid #ddd;border-radius:6px;width:100%;box-sizing:border-box}
 .form button{background:#c0392b;color:#fff;border:none;cursor:pointer;font-weight:bold}
 .form button:hover{background:#a93226}
 .btn-refresh{background:#2980b9;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:8px}
 .btn-refresh:hover{background:#1f6aa5}
 /* 基金按钮 */
 .funds{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
 .fund-btn{padding:6px 12px;border:1px solid #ddd;border-radius:20px;cursor:pointer;font-size:13px;background:#fff}
 .fund-btn.active{background:#c0392b;color:#fff;border-color:#c0392b}
</style>
</head>
<body>
<h1>投资组合分析工具</h1>
<div class="sub">本地Web应用 · Python + SQLite · 日年化(XIRR) · 可演进</div>

<div class="card">
  <div class="info" id="info">加载中...</div>
</div>

<div class="card">
  <div class="range">
    <span>时间段:</span>
    <div class="range-btn" data-days="30">近1月</div>
    <div class="range-btn active" data-days="91">近3月</div>
    <div class="range-btn" data-days="182">近6月</div>
    <div class="range-btn" data-days="365">近1年</div>
    <div class="range-btn" data-days="0">全部</div>
    <span style="margin-left:8px">自定义:</span>
    <input type="date" id="r_from"> ~ <input type="date" id="r_to">
  </div>
  <div style="margin-bottom:8px"><b>整体年化(XIRR)</b> <span style="color:#888;font-size:12px">勾选参与计算的基金(默认不含国开债/短融ETF)</span>
    <span style="margin-left:12px;font-size:12px;color:#888">周期:</span>
    <span class="gran-btn range-btn active" data-gran="day">日</span>
    <span class="gran-btn range-btn" data-gran="week">周</span>
    <span class="gran-btn range-btn" data-gran="month">月</span>
    <span class="gran-btn range-btn" data-gran="quarter">季</span>
    <span class="gran-btn range-btn" data-gran="year">年</span>
  </div>
  <div id="core_sel" class="funds" style="margin-bottom:8px"></div>
  <div class="chart" id="overall"></div>
</div>

<div class="card">
  <div style="margin-bottom:8px"><b>持仓市值走势</b></div>
  <div class="chart" id="mv"></div>
</div>

<div class="card">
  <div class="range">
    <span>时间段:</span>
    <div class="range-btn fr" data-days="30">近1月</div>
    <div class="range-btn fr active" data-days="91">近3月</div>
    <div class="range-btn fr" data-days="182">近6月</div>
    <div class="range-btn fr" data-days="365">近1年</div>
    <div class="range-btn fr" data-days="0">全部</div>
    <span style="margin-left:8px">自定义:</span>
    <input type="date" id="fr_from"> ~ <input type="date" id="fr_to">
  </div>
  <div style="margin-bottom:8px"><b>单只基金</b> <span style="color:#888;font-size:12px">点击按钮切换</span>
    <span style="margin-left:12px;font-size:12px;color:#888">周期:</span>
    <span class="fgran-btn range-btn active" data-gran="day">日</span>
    <span class="fgran-btn range-btn" data-gran="week">周</span>
    <span class="fgran-btn range-btn" data-gran="month">月</span>
    <span class="fgran-btn range-btn" data-gran="quarter">季</span>
    <span class="fgran-btn range-btn" data-gran="year">年</span>
  </div>
  <div class="funds" id="funds"></div>
  <div class="chart" id="fund"></div>
</div>

<div class="card">
  <div style="margin-bottom:8px"><b>录入持仓变化</b> <span style="color:#888;font-size:12px">提交后自动重算曲线</span></div>
  <div class="form">
    <div><label>日期</label><input id="f_date" type="date"></div>
    <div><label>标的</label><select id="f_code"></select></div>
    <div><label>操作</label><select id="f_action"><option value="BUY">买入</option><option value="SELL">卖出</option></select></div>
    <div><label>数量</label><input id="f_qty" type="number" min="1" placeholder="股数/份数"></div>
    <div><label>价格(可选)</label><input id="f_price" type="number" step="0.0001" placeholder="成交价"></div>
    <div style="display:flex;align-items:flex-end"><button id="btn_submit">提交</button></div>
  </div>
  <button class="btn-refresh" id="btn_refresh">刷新曲线</button>
  <div id="msg" style="font-size:12px;color:#27ae60;margin-top:6px"></div>
</div>

<script>
let FUNDS = {};
let DEFAULT_FUND = '';
let overallChart, mvChart, fundChart;
let curRange = {days:91, from:null, to:null};   // 默认近3个月
let curFundRange = {days:91, from:null, to:null};       // 单基金区间, 默认近3个月
let lastDaily = [], lastBench = [];

// ---------- 时间区间 ----------
function rangeStart(){
  if(curRange.days>0){
    const d = new Date(); d.setDate(d.getDate()-curRange.days);
    return d.toISOString().slice(0,10);
  }
  if(curRange.from) return curRange.from;
  return '1900-01-01';
}
function rangeEnd(){ return curRange.to || '2999-12-31'; }
function inRange(d){ return d>=rangeStart() && d<=rangeEnd(); }
function fundRangeStart(){
  if(curFundRange.days>0){
    const d=new Date(); d.setDate(d.getDate()-curFundRange.days);
    return d.toISOString().slice(0,10);
  }
  return '1900-01-01';
}
function fundInRange(d){ return d>=fundRangeStart() && d<=fundRangeEnd(); }
function fundRangeEnd(){ return curFundRange.to || '2999-12-31'; }

// ---------- 周期汇聚(日/周/月/季/年): 后端按周期真实资金加权年化, 前端只传参 ----------
let curGran = 'day';        // 整体年化周期
let curFundGran = 'day';    // 单基金年化周期
function wireGran(cls, setter, rerender){
  document.querySelectorAll('.'+cls).forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.'+cls).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    setter(b.dataset.gran); rerender();
  });
}

function applyRangeBtn(el){
  document.querySelectorAll('.range-btn:not(.fr):not(.gran-btn):not(.fgran-btn)').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  curRange.days = parseInt(el.dataset.days||'0');
  curRange.from = curRange.days>0 ? null : document.getElementById('r_from').value||null;
  curRange.to   = curRange.days>0 ? null : document.getElementById('r_to').value||null;
  renderAll();
}
document.querySelectorAll('.range-btn:not(.fr)').forEach(b=>b.onclick=()=>applyRangeBtn(b));
document.querySelectorAll('.range-btn.fr').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.range-btn.fr').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  curFundRange.days = parseInt(b.dataset.days||'0');
  if(curFundRange.days>0){ curFundRange.from=curFundRange.to=null; }
  if(curFundCode) renderFund(curFundCode);
});
document.getElementById('fr_from').onchange = ()=>{curFundRange.days=0;curFundRange.from=document.getElementById('fr_from').value||null;
  document.querySelectorAll('.range-btn.fr').forEach(x=>x.classList.remove('active'));
  if(curFundCode) renderFund(curFundCode);};
document.getElementById('fr_to').onchange = ()=>{curFundRange.days=0;curFundRange.to=document.getElementById('fr_to').value||null;
  document.querySelectorAll('.range-btn.fr').forEach(x=>x.classList.remove('active'));
  if(curFundCode) renderFund(curFundCode);};
document.getElementById('r_from').onchange = ()=>{curRange.days=0;curRange.from=document.getElementById('r_from').value||null;
  document.querySelectorAll('.range-btn:not(.fr):not(.gran-btn):not(.fgran-btn)').forEach(x=>x.classList.remove('active'));renderAll();};
document.getElementById('r_to').onchange = ()=>{curRange.days=0;curRange.to=document.getElementById('r_to').value||null;
  document.querySelectorAll('.range-btn:not(.fr):not(.gran-btn):not(.fgran-btn)').forEach(x=>x.classList.remove('active'));renderAll();};

 // ---------- 整体年化基金选择 ----------
 const CORE_EXCLUDE_DEFAULT = ['159649','511360'];  // 默认不含: 国开债/短融ETF
 function coreSelCodes(){
   try{ const s = JSON.parse(localStorage.getItem('core_sel')||'null'); if(Array.isArray(s)&&s.length) return s.filter(c=>FUNDS[c]); }catch(e){}
   return Object.keys(FUNDS).filter(c=>CORE_EXCLUDE_DEFAULT.indexOf(c)<0);
 }
 function buildCoreSel(){
   const sel = document.getElementById('core_sel'); sel.innerHTML='';
   const codes = coreSelCodes();
   Object.keys(FUNDS).forEach(code=>{
     const b = document.createElement('div');
     b.className='fund-btn'+(codes.indexOf(code)>=0?' active':'');
     b.textContent=FUNDS[code]; b.dataset.code=code;
     b.onclick=()=>{
       const cur = coreSelCodes();
       const i = cur.indexOf(code);
       if(i>=0) cur.splice(i,1); else cur.push(code);
       localStorage.setItem('core_sel', JSON.stringify(cur));
       buildCoreSel(); fetchDaily();
     };
     sel.appendChild(b);
   });
 }

// ---------- 数据加载 ----------
function loadFunds(data){
  FUNDS = data.funds||{};
  DEFAULT_FUND = data.default_fund||Object.keys(FUNDS)[0];
  const sel = document.getElementById('f_code');
  sel.innerHTML='';
  Object.keys(FUNDS).forEach(code=>{
    const o=document.createElement('option'); o.value=code; o.textContent=FUNDS[code]+' ('+code+')';
    sel.appendChild(o);
  });
  sel.value = DEFAULT_FUND;   // 录入页标的也默认创业50
  buildFundButtons();
}

function buildFundButtons(){
  const container = document.getElementById('funds');
  container.innerHTML='';
  Object.keys(FUNDS).forEach(code=>{
    const b = document.createElement('div');
    b.className='fund-btn'; b.textContent=FUNDS[code]; b.dataset.code=code;
    b.onclick = ()=>renderFund(code);
    container.appendChild(b);
  });
}

function filterByRange(arr){
  return arr.filter(o=>inRange(o.d));
}

function renderAll(){
  if(!lastDaily.length) return;
  const daily = filterByRange(lastDaily);
  if(!daily.length) return;
  const xs = daily.map(o=>o.d);
  const xirr = daily.map(o=>o.xirr==null?null:o.xirr);
  const mv = daily.map(o=>o.mv);
  // 基准数据(上证指数, 同周期真实年化)
  const bx = filterByRange(lastBench);
  const bxirr = bx.map(o=>o.xirr==null?null:o.xirr);
  const bpct = bx.map(o=>o.pct==null?null:o.pct);
  // 信息栏显示周期末真实年化(取当前周期数据最后一点)
  const last = daily[daily.length-1];
  const lastB = bx.length?bx[bx.length-1]:{};
  document.getElementById('info').innerHTML =
    '<div>期末<b>'+last.d+'</b></div>'+
    '<div>当前市值<b>'+(last.mv/10000).toFixed(1)+'万</b></div>'+
    '<div>年化<b>'+(last.xirr==null?'—':last.xirr+'%')+'</b></div>'+
    '<div>上证基准<b>'+(lastB.xirr==null?'—':lastB.xirr+'%')+'</b></div>'+
    '<div>上证累计涨跌<b>'+(lastB.pct==null?'—':lastB.pct+'%')+'</b></div>';
  const baseAxis = {type:'category',data:xs,axisLabel:{rotate:45,fontSize:10},boundaryGap:false};
  // 整体年化
  if(!overallChart) overallChart=echarts.init(document.getElementById('overall'));
  overallChart.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['年化','上证基准年化','上证累计涨跌'],top:0,textStyle:{fontSize:11}},
    grid:{left:60,right:60,top:40,bottom:50},
    xAxis:baseAxis,
    yAxis:[{type:'value',name:'%',axisLabel:{formatter:'{value}%'},position:'left'}],
    series:[
      {name:'年化',type:'line',smooth:true,symbol:'none',data:xirr,color:'#c0392b',lineStyle:{width:2,color:'#c0392b'},areaStyle:{color:'#c0392b',opacity:0.12}},
      {name:'上证基准年化',type:'line',smooth:true,symbol:'none',data:bxirr,color:'#2980b9',lineStyle:{width:1.5,color:'#2980b9'},yAxisIndex:0},
      {name:'上证累计涨跌',type:'line',smooth:true,symbol:'none',data:bpct,color:'#27ae60',lineStyle:{width:1.5,color:'#27ae60',type:'dashed'},yAxisIndex:0}
    ]
  },true);
  // 市值
  if(!mvChart) mvChart=echarts.init(document.getElementById('mv'));
  mvChart.setOption({
    tooltip:{trigger:'axis'}, grid:{left:80,right:30,top:40,bottom:50},
    xAxis:baseAxis,
    yAxis:{type:'value',name:'市值',axisLabel:{formatter:v=>(v/10000).toFixed(0)+'万'}},
    series:[{name:'持仓市值',type:'line',smooth:true,symbol:'none',data:mv,lineStyle:{width:2,color:'#2980b9'},areaStyle:{color:'#2980b9',opacity:0.1}}]
  },true);
}

async function fetchDaily(){
  if(!Object.keys(FUNDS).length) return;
  const codes = coreSelCodes();
  let url = '/api/daily'+(codes.length?('?codes='+codes.join(',')):'');
  if(curGran!=='day') url += (codes.length?'&':'?')+'gran='+curGran;
  const [dr, br] = await Promise.all([
    fetch(url).then(r=>r.json()),
    fetch('/api/benchmark'+(curGran!=='day'?('?gran='+curGran):'')).then(r=>r.json())
  ]);
  lastDaily = dr.daily||[];
  lastBench = br.bench_xirr||[];
  renderAll();
}

async function fetchAndRender(){
  // 首屏: 基金列表 + daily + benchmark(按当前周期)
  const pr = fetch('/api/daily').then(r=>r.json());      // 只为拿 funds 列表(快, 走缓存)
  const data = await pr;
  loadFunds(data);
  buildCoreSel();
  await fetchDaily();
  renderFund(DEFAULT_FUND);   // 单只基金默认创业50
  initSim();                  // 基金列表就绪后再初始化比例调整预测表单
}

let curFundCode = null;
async function renderFund(code){
  if(!code) return;
  curFundCode = code;
  document.querySelectorAll('#funds .fund-btn').forEach(x=>x.classList.toggle('active', x.dataset.code===code));
  const r = await fetch('/api/fund_xirr?code='+code+(curFundGran!=='day'?('&gran='+curFundGran):'')).then(r=>r.json());
  if(curFundCode!==code) return;  // 已切到别的基金, 丢弃过期响应
  if(!fundChart) fundChart=echarts.init(document.getElementById('fund'));
  const series = (r.series||[]).filter(p=>fundInRange(p.d));
  const days = series.map(p=>p.d);
  const xirr = series.map(p=>p.xirr==null?null:p.xirr);
  const all = r.series||[];
  const last = all[all.length-1]||{};
  const currMv = last.mv!=null ? ' · 当前市值 '+(last.mv/10000).toFixed(1)+'万' : '';
  const currPos = last.pos!=null ? ' · 持仓 '+last.pos : '';
  const currXirr = last.xirr!=null ? ' · 年化 '+last.xirr+'%' : '';
  const title = (r.name||code)+' 个人年化(XIRR)'+currPos+currMv+currXirr;
  fundChart.setOption({
    title:{text:title,left:'center',textStyle:{fontSize:15}},
    tooltip:{trigger:'axis',formatter:function(ps){const p=ps[0];const idx=p.dataIndex;const pt=series[idx]||{};const v=p.value;return p.name+'<br/>个人年化:'+(v==null?'—':v.toFixed(2)+'%')+'<br/>持仓:'+(pt.pos==null?'—':pt.pos)+'<br/>市值:'+(pt.mv==null?'—':(pt.mv/10000).toFixed(2)+'万');}},
    grid:{left:60,right:30,top:50,bottom:50},
    xAxis:{type:'category',data:days,axisLabel:{rotate:45,fontSize:10},boundaryGap:false},
    yAxis:{type:'value',name:'年化%',axisLabel:{formatter:'{value}%'}},
    series:[{name:'个人年化',type:'line',smooth:true,symbol:'none',data:xirr,lineStyle:{width:1.5,color:'#27ae60'},areaStyle:{color:'#27ae60',opacity:0.1}}]
  },true);
}

// 提交持仓变化
wireGran('gran-btn', g=>{curGran=g;}, ()=>fetchDaily());
wireGran('fgran-btn', g=>{curFundGran=g;}, ()=>{ if(curFundCode) renderFund(curFundCode); });
document.getElementById('btn_submit').onclick = async ()=>{
  const body = {
    date: document.getElementById('f_date').value,
    code: document.getElementById('f_code').value,
    action: document.getElementById('f_action').value,
    qty: parseFloat(document.getElementById('f_qty').value),
    price: document.getElementById('f_price').value?parseFloat(document.getElementById('f_price').value):null,
  };
  const r = await fetch('/api/holding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  document.getElementById('msg').textContent = '已提交: '+JSON.stringify(d.received||d);
  await fetchAndRender();
};
document.getElementById('btn_refresh').onclick = fetchAndRender;

// ---------- 比例调整预测(表格) ----------
// 类别分组: 同类基金的调整后市值合并算比例
const SIM_GROUPS = [
  {name:'国债/短融', codes:['511090','511130','511360','159649']},
  {name:'A股宽基/红利', codes:['159682','159593','515180','563020']},
  {name:'美股', codes:['513100','513650']},
  {name:'半导体', codes:['159516']},
  {name:'黄金', codes:['518880','159937']},
];
let simPositions = [];
let simInited = false;
function fmtNum(v, d){ return (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPct(v){ return (v==null||isNaN(v)) ? '—' : (v*100).toFixed(1)+'%'; }

async function initSim(){
  if(simInited) return; simInited = true;
  try{
    const d = await fetch('/api/positions').then(r=>r.json());
    if(!d.ok){ document.getElementById('sim_msg').textContent = '加载持仓失败: '+(d.error||''); return; }
    simPositions = d.positions||[];
    document.getElementById('pos_date').textContent = '数据日期 '+d.date;
    // 从后端恢复已保存的拟持仓值
    try{
      const sv = await fetch('/api/sim_targets').then(r=>r.json());
      if(sv && sv.ok && sv.targets){ simTargets = sv.targets; }
    }catch(e){}
    buildSimTable();
    updateSimTable();
  }catch(e){ document.getElementById('sim_msg').textContent = '加载持仓失败: '+e; }
}

// 拟持仓目标值状态(独立于 DOM): 留空 = 维持当前持仓
let simTargets = {};   // {code: number}
let simRows = [];      // 每行的单元格引用, 供局部更新
let simSaveTimer = null;

function simSaveTargets(){
  // 防抖保存到数据库, 刷新页面自动恢复
  clearTimeout(simSaveTimer);
  simSaveTimer = setTimeout(()=>{
    fetch('/api/sim_targets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targets:simTargets})}).catch(()=>{});
  }, 500);
}

// 表格只构建一次: 输入框与单元格引用固定, 之后永不重建 DOM
function buildSimTable(){
  const tbody = document.getElementById('sim_body');
  tbody.innerHTML='';
  const codeGroup = {};
  SIM_GROUPS.forEach(g=>g.codes.forEach(c=>codeGroup[c]=g.name));
  const groupOrder = SIM_GROUPS.map(g=>g.name).concat(['其他']);
  const rows = simPositions.map(p=>({p, group: codeGroup[p.code]||'其他'}));
  rows.sort((a,b)=>groupOrder.indexOf(a.group)-groupOrder.indexOf(b.group));
  const groupCount = {};
  rows.forEach(r=>{ groupCount[r.group]=(groupCount[r.group]||0)+1; });
  const seenGroup = {}, seenGroupNow = {};
  simRows = [];
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const cells = [];
    // 前四列: 名称/持仓/价格/市值
    const t1 = document.createElement('td');
    t1.style.cssText='padding:5px 10px;border:1px solid #ddd';
    t1.textContent = r.p.name; tr.appendChild(t1); cells.push({el:t1});
    const mkNum=(align)=>{const t=document.createElement('td');t.style.cssText='padding:5px 10px;border:1px solid #ddd;text-align:right';tr.appendChild(t);cells.push({el:t});return t;};
    // cells[1]=当前持仓, [2]=当前价格, [3]=当前净值, [4]=当前市值, [5]=当前比例
    mkNum(); mkNum(); mkNum(); mkNum(); mkNum();
    // 当前类别比例列(同类合并, 首行 rowspan; 非首行不渲染单元格)
    if(!seenGroupNow[r.group]){
      seenGroupNow[r.group]=true;
      const gtNow = document.createElement('td');
      if(groupCount[r.group]>1) gtNow.rowSpan = groupCount[r.group];
      gtNow.style.cssText='padding:5px 10px;border:1px solid #ddd;text-align:right;vertical-align:middle';
      tr.appendChild(gtNow); cells.nowGroup = gtNow;
    }
    // 第5列: 拟持仓输入框(永久 DOM)
    const td = document.createElement('td');
    td.style.cssText='padding:2px 6px;border:1px solid #ddd';
    const inp = document.createElement('input');
    inp.type='number'; inp.step='any'; inp.min='0'; inp.dataset.code=r.p.code;
    inp.style.cssText='width:110px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;text-align:right;font-size:13px';
    // 从数据库恢复的拟持仓值回填到输入框(不主动更改不会变)
    if(simTargets[r.p.code]!=null) inp.value = simTargets[r.p.code];
    inp.addEventListener('input', function(){
      const v = this.value==='' ? null : parseFloat(this.value);
      if(v==null||isNaN(v)){ delete simTargets[this.dataset.code]; }
      else { simTargets[this.dataset.code]=v; }
      updateSimTable();
      simSaveTargets();
    });
    td.appendChild(inp); tr.appendChild(td);
    // 第8-11列(cells[6]-[9]): 调整数量/调整金额/调整后市值/调整后比例
    for(let k=0;k<4;k++){ mkNum(); }
    // 第10列: 类别合并框(同类第一行 rowspan)
    if(!seenGroup[r.group]){
      seenGroup[r.group]=true;
      const gt = document.createElement('td');
      if(groupCount[r.group]>1) gt.rowSpan = groupCount[r.group];
      gt.style.cssText='padding:5px 10px;border:1px solid #ddd;vertical-align:middle;background:#fafafa';
      gt.innerHTML='<b>'+r.group+'</b><br><span class="g_pct" style="color:#c0392b;font-size:15px"></span><br><span class="g_mv" style="color:#888;font-size:12px"></span>';
      cells.groupCell = {pct: gt.querySelector('.g_pct'), mv: gt.querySelector('.g_mv'), name: r.group};
      tr.appendChild(gt);
    }
    tbody.appendChild(tr);
    simRows.push({r, cells, inp});
  });
}

// 只更新数字, 不动 DOM 结构, 输入框焦点不丢
function updateSimTable(){
  const calc = simRows.map(o=>{
    const p = o.r.p;
    const target = simTargets[p.code]!=null ? simTargets[p.code] : p.pos;
    const mv = (p.pos||0)*(p.price||0);
    const mvAfter = (target||0)*(p.price||0);
    return {target: isNaN(target)?0:target, mv, mvAfter, group: o.r.group, p};
  });
  const totalAfter = calc.reduce((s,r)=>s+r.mvAfter,0);
  const totalNow = calc.reduce((s,r)=>s+r.mv,0);
  const totalAdj = calc.reduce((s,r)=>s+(r.target-r.p.pos)*(r.p.price||0),0);
  const groupSum = {}, groupNow = {};
  calc.forEach(r=>{ groupSum[r.group]=(groupSum[r.group]||0)+r.mvAfter; groupNow[r.group]=(groupNow[r.group]||0)+r.mv; });
  const gCells = {}, nowGroupShown = {};
  const totalNowPctDone = {};
  simRows.forEach((o,i)=>{
    const c = calc[i], p = c.p, cells = o.cells;
    const adjQty = c.target - p.pos;
    const adjAmt = adjQty * (p.price||0);
    const cls = adjQty>0 ? '#c0392b' : (adjQty<0 ? '#27ae60' : '');
    cells[1].el.textContent = fmtNum(p.pos,0);
    cells[2].el.textContent = fmtNum(p.price,3);
    cells[3].el.textContent = fmtNum(p.nav,3);
    cells[4].el.textContent = fmtNum(c.mv,0);
    cells[5].el.textContent = fmtPct(totalNow>0?c.mv/totalNow:null);
    // 当前类别比例: 仅同类首行单元格写入一次(其余行 display:none)
    if(cells.nowGroup && !nowGroupShown[c.group]){
      nowGroupShown[c.group]=true;
      cells.nowGroup.textContent = fmtPct(totalNow>0?(groupNow[c.group]||0)/totalNow:null);
    }
    cells[6].el.textContent = fmtNum(adjQty,0); cells[6].el.style.color=cls;
    cells[7].el.textContent = fmtNum(adjAmt,0); cells[7].el.style.color=cls;
    cells[8].el.textContent = fmtNum(c.mvAfter,0);
    cells[9].el.textContent = fmtPct(totalAfter>0?c.mvAfter/totalAfter:null);
    if(cells.groupCell) gCells[cells.groupCell.name]=cells.groupCell;
  });
  Object.keys(gCells).forEach(g=>{
    gCells[g].pct.textContent = fmtPct(totalAfter>0?(groupSum[g]||0)/totalAfter:null);
    gCells[g].mv.textContent = fmtNum(groupSum[g]||0,0)+'元';
  });
  document.getElementById('sim_foot').innerHTML =
    '<tr><td style="padding:6px 10px;border:1px solid #ddd">合计</td>'+
    '<td style="border:1px solid #ddd"></td><td style="border:1px solid #ddd"></td><td style="border:1px solid #ddd"></td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right">'+fmtNum(totalNow,0)+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right">100%</td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right">100%</td>'+
    '<td style="border:1px solid #ddd"></td>'+
    '<td style="border:1px solid #ddd"></td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right;color:'+(totalAdj>0?'#c0392b':'#27ae60')+'">'+fmtNum(totalAdj,0)+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right">'+fmtNum(totalAfter,0)+'</td>'+
    '<td style="padding:6px 10px;border:1px solid #ddd;text-align:right">100%</td><td style="border:1px solid #ddd"></td></tr>';
  document.getElementById('sim_msg').textContent = '拟持仓列直接输入数字,自动重算并保存;留空 = 维持当前持仓。红=买入,绿=卖出。';
}

// 录入页日期默认今天
document.getElementById('f_date').value = new Date().toISOString().slice(0,10);

window.addEventListener('resize',()=>{overallChart&&overallChart.resize();mvChart&&mvChart.resize();fundChart&&fundChart.resize();});

fetchAndRender();
</script>
